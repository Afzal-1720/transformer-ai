services:
  - type: web
    name: transformer-ai-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: SIMULATION_INTERVAL_SEC
        value: "2.0"
    plan: free
